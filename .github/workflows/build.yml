name: Build LiveFlow Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller widget.spec

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/widget AppDir/usr/bin/liveflow-widget
          chmod +x AppDir/usr/bin/liveflow-widget
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir LiveFlow-Widget-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Linux-AppImage
          path: LiveFlow-Widget-x86_64.AppImage
      - name: Build DEB package
        run: |
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps

          cp dist/widget deb-package/usr/bin/liveflow-widget
          chmod +x deb-package/usr/bin/liveflow-widget

          cp AppDir/liveflow-widget.desktop \
             deb-package/usr/share/applications/liveflow-widget.desktop

          cp AppDir/liveflow-widget.png \
             deb-package/usr/share/icons/hicolor/256x256/apps/liveflow-widget.png

          cat > deb-package/DEBIAN/control << 'EOF'
          Package: liveflow-widget
          Version: 1.1.4
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Reza
          Description: LiveFlow financial market widget
           TGJU live market price widget for Linux.
          EOF

          dpkg-deb --build deb-package LiveFlow-Widget-amd64.deb

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Linux-DEB
          path: LiveFlow-Widget-amd64.deb
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller widget.spec

      - name: Rename executable
        run: |
          Rename-Item dist/widget.exe LiveFlow-Widget.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Windows
          path: dist/LiveFlow-Widget.exe
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller \
            --windowed \
            --name LiveFlow-Widget \
            --add-data "config:config" \
            app/widget.py

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R dist/LiveFlow-Widget.app dmg/LiveFlow-Widget.app
          hdiutil create -volname "LiveFlow Widget" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            LiveFlow-Widget-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-macOS
          path: LiveFlow-Widget-macOS.dmg
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" \
            release-files/* \
            --title "LiveFlow Widget $VERSION" \
            --generate-notes
