name: Build LiveFlow Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller widget.spec

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/widget AppDir/usr/bin/liveflow-widget
          chmod +x AppDir/usr/bin/liveflow-widget
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir LiveFlow-Widget-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Linux-AppImage
          path: LiveFlow-Widget-x86_64.AppImage
