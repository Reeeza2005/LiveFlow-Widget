name: Build LiveFlow Widget

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: get_version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-22.04
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: Build Linux executable
        run: |
          pyinstaller widget.spec

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp dist/widget AppDir/usr/bin/liveflow-widget
          chmod +x AppDir/usr/bin/liveflow-widget

          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ./appimagetool AppDir \
            "LiveFlow-Widget-${{ needs.version.outputs.version }}-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Linux-AppImage
          path: LiveFlow-Widget-${{ needs.version.outputs.version }}-x86_64.AppImage

      - name: Build DEB package
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps

          cp dist/widget deb-package/usr/bin/liveflow-widget
          chmod +x deb-package/usr/bin/liveflow-widget

          cp AppDir/liveflow-widget.desktop \
             deb-package/usr/share/applications/liveflow-widget.desktop

          cp AppDir/liveflow-widget.png \
             deb-package/usr/share/icons/hicolor/256x256/apps/liveflow-widget.png

          cat > deb-package/DEBIAN/control << EOF
          Package: liveflow-widget
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Reza
          Description: LiveFlow financial market widget
           TGJU live market price widget for Linux.
          EOF

          dpkg-deb --build \
            deb-package \
            "LiveFlow-Widget-${VERSION}-amd64.deb"

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Linux-DEB
          path: LiveFlow-Widget-${{ needs.version.outputs.version }}-amd64.deb

  build-windows:
    runs-on: windows-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 Pillow

      - name: Build Windows executable
        run: |
          pyinstaller widget.spec

      - name: Rename executable
        run: |
          Rename-Item dist/widget.exe `
            "LiveFlow-Widget-${{ needs.version.outputs.version }}-Windows.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-Windows
          path: dist/LiveFlow-Widget-${{ needs.version.outputs.version }}-Windows.exe

  build-macos:
    runs-on: macos-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: Build macOS app
        run: |
          pyinstaller \
            --windowed \
            --name "LiveFlow-Widget-${{ needs.version.outputs.version }}" \
            --add-data "config:config" \
            app/widget.py

      - name: Create DMG
        run: |
          mkdir -p dmg

          cp -R \
            "dist/LiveFlow-Widget-${{ needs.version.outputs.version }}.app" \
            dmg/

          hdiutil create \
            -volname "LiveFlow Widget ${{ needs.version.outputs.version }}" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "LiveFlow-Widget-${{ needs.version.outputs.version }}-macOS.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: LiveFlow-Widget-macOS
          path: LiveFlow-Widget-${{ needs.version.outputs.version }}-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.version.outputs.version }}"

          gh release create "$VERSION" \
            release-files/* \
            --title "LiveFlow Widget $VERSION" \
            --generate-notes
